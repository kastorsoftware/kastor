name: Bug report
description: Report something that does not work as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Clear reports are the fastest way to get bugs fixed.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly and include the exact error message if there is one.
      placeholder: The app did ... but I expected ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest numbered sequence that consistently reproduces the issue.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: I expected ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your OS, Kastor version or commit, and any relevant setup details.
      placeholder: Windows 11 24H2, Kastor v..., ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or additional context
      description: Remove tokens, account data, and other sensitive information before posting.
      render: text
