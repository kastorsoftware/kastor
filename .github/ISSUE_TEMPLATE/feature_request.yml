name: Feature request
description: Suggest an improvement to Kastor.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Good ideas are welcome. Explain the problem first so we can understand the value of the proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: It is difficult to ... because ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: It would help if Kastor could ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: I also tried ...
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples, or related issues are helpful.
